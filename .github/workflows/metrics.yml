name: Advanced GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ========= OVERVIEW =========
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          template: classic
          base: header,activity,repositories
          config_timezone: Asia/Kolkata

      # ========= LANGUAGES =========
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          languages: yes
          languages_indepth: yes
          languages_limit: 15
          languages_threshold: 0%
          languages_details: bytes-size,percentage
          languages_recent_days: 60
          languages_recent_load: 500

      # ========= ACTIVITY =========
      - name: Activity
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          activity: yes
          activity_limit: 15
          activity_days: 21
          activity_filter: all

      # ========= HABITS =========
      - name: Habits
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          habits: yes
          habits_from: 300
          habits_days: 30
          habits_facts: yes
          habits_charts: yes

      # ========= ISOCALENDAR =========
      - name: Isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          isocalendar: yes
          isocalendar_duration: full-year

      # ========= LINES OF CODE =========
      - name: Lines of Code
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          lines: yes
          lines_sections: base,history

      # ========= ACHIEVEMENTS =========
      - name: Achievements
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: CrazAr374
          base: ""
          achievements: yes
          achievements_threshold: C
          achievements_display: detailed
          achievements_secrets: true

